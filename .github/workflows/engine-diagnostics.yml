name: Inspect captured engine startup
on:
  push:
    branches: ["fix/engine-runtime-diagnostics"]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Packaged-engine-readiness
          run-id: 37036121023
          github-token: ${{ github.token }}
          path: /tmp/codexpad-captured-engine
      - name: Read captured startup diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/codexpad-captured-engine")
          print("Captured files:", [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()])
          path = root / "engine-readiness/simulator-engine.log"
          lines = path.read_text().splitlines()
          print("Startup log lines:", len(lines))
          pattern = re.compile(r"error|fault|exception|crash|fatal|watchdog|boot|exit|failed|assert|panic|terminate|kill|Code Mode", re.I)
          relevant = [line for line in lines if pattern.search(line)]
          print("Relevant startup diagnostics:")
          print("\n".join(relevant[-200:]))
          print("Final startup log context:")
          print("\n".join(lines[-80:]))
          PY
