# Free-plan compatible ARM64 pipeline: one Apple-silicon M2 worker builds the
# Linux app-server download/rootfs and then the unsigned iPad app. No paid Linux worker,
# Apple account, signing key, Docker VM, or hand-carried artifact URL is needed.
workflows:
  arm64-ipad-all-in-one:
    name: CodexPad ARM64 iPad (M2 all-in-one)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "fix/ipad-login-flow"
          include: true
          source: true
        - pattern: "feature/macos-codex-ui"
          include: true
          source: true
        - pattern: "fix/complete-arm64-build"
          include: true
          source: true
        - pattern: "fix/codemagic-arm64-m2"
          include: true
          source: true
        - pattern: "fix/arm64-m2-codemagic"
          include: true
          source: true
        - pattern: "fix/aarch64-musl-jemalloc-link"
          include: true
          source: true
        - pattern: "fix/official-arm64-app-server"
          include: true
          source: true
        - pattern: "fix/macos-apk-static-library"
          include: true
          source: true
        - pattern: "fix/arm64-swift-source-phase"
          include: true
          source: true
        - pattern: "fix/arm64-meson-link-path"
          include: true
          source: true
        - pattern: "fix/engine-runtime-readiness"
          include: true
          source: true
        - pattern: "main"
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - ~/.cargo/registry
        - ~/.cargo/git
        - ~/.cargo/bin
        - ~/.rustup/toolchains
        - ~/.codexpad-zig
        - ~/.codexpad-codex-releases
        - ~/.codexpad-apk-tools
        - ~/.codexpad-cargo-target
        - ~/Library/Caches/Homebrew
    scripts:
      - name: Prepare native macOS build tools
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          missing=()
          for formula in llvm lld meson ninja pkgconf openssl@3 zlib zstd jq xz coreutils gnu-sed gnu-tar libarchive; do
            brew list "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if (( ${#missing[@]} )); then
            brew install "${missing[@]}"
          fi
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$(brew --prefix gnu-tar)/libexec/gnubin:$PATH"
          command -v sha256sum
          command -v install
          command -v sed
          command -v tar
          meson --version
          ninja --version
          python3 -m py_compile \
            scripts/check-arm64-elf.py \
            scripts/summarize-build-failure.py \
            scripts/download-codex-arm64.py \
            scripts/prepare-arm64-ios.py \
            scripts/probe-arm64-websocket.py \
            scripts/validate-codex-protocol.py

          python3 tests/codexpad/test_release_download.py
          python3 tests/codexpad/test_apk_bootstrap.py
          python3 tests/codexpad/test_ios_runtime_build.py
          python3 tests/codexpad/test_build_failure_summary.py
          python3 tests/codexpad/test_imported_runtime.py
          python3 tests/codexpad/test_ipa_runtime.py
          python3 tests/codexpad/test_runtime_archive.py
          python3 tests/codexpad/test_code_mode_probe.py
          python3 tests/codexpad/test_engine_readiness.py
          model_bundle=/tmp/CodexPadModelRegression.app/Contents
          mkdir -p "$model_bundle/MacOS" "$model_bundle/Resources"
          cp app/CodexPad/CodexClientRequest.schema.json "$model_bundle/Resources/"
          cp Dependencies/upstreams.json "$model_bundle/Resources/"
          python3 -c 'import plistlib; from pathlib import Path; Path("/tmp/CodexPadModelRegression.app/Contents/Info.plist").write_bytes(plistlib.dumps({"CFBundleExecutable":"model-regression","CFBundleIdentifier":"com.codexpad.regression","CFBundlePackageType":"APPL"}))'
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library \
            app/CodexPad/CodexJSON.swift app/CodexPad/CodexModels.swift \
            app/CodexPad/CodexFeatureCatalog.swift app/CodexPad/CodexRPC.swift \
            app/CodexPad/CodexWorkspaceModel.swift tests/codexpad/ModelRegression.swift \
            -o "$model_bundle/MacOS/model-regression"
          "$model_bundle/MacOS/model-regression"

      - name: Download verified AArch64 Codex and build Alpine guest
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$(brew --prefix gnu-tar)/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          mkdir -p "$CM_BUILD_DIR/artifacts" "$CM_BUILD_DIR/.codex-local"
          codex_rev="$(python3 -c 'import json; print(json.load(open("Dependencies/upstreams.json"))["codex"]["revision"])')"
          export CODEX_SOURCE_DIR="$CM_BUILD_DIR/.codex-local/codex-upstream"
          if [ ! -d "$CODEX_SOURCE_DIR/.git" ]; then
            mkdir -p "$CODEX_SOURCE_DIR"
            git -C "$CODEX_SOURCE_DIR" init
            git -C "$CODEX_SOURCE_DIR" remote add origin https://github.com/openai/codex.git
          fi
          git -C "$CODEX_SOURCE_DIR" fetch --depth 1 origin "$codex_rev"
          git -C "$CODEX_SOURCE_DIR" reset --hard FETCH_HEAD
          git -C "$CODEX_SOURCE_DIR" clean -fdx
          git -C "$CODEX_SOURCE_DIR" checkout --force --detach FETCH_HEAD
          release_tag="$(python3 -c 'import json; print(json.load(open("Dependencies/upstreams.json"))["codex"]["release"]["tag"])')"
          git -C "$CODEX_SOURCE_DIR" fetch --depth 1 origin "refs/tags/$release_tag:refs/tags/$release_tag"
          test "$(git -C "$CODEX_SOURCE_DIR" rev-parse "$release_tag^{commit}")" = "$codex_rev"
          # Validate the release source against the complete native GUI contract.
          python3 scripts/validate-codex-protocol.py \
            "$CODEX_SOURCE_DIR/codex-rs/app-server-protocol/schema/json"
          export CODEX_BINARY="$CM_BUILD_DIR/artifacts/codex-app-server"
          python3 scripts/download-codex-arm64.py --output "$CODEX_BINARY" \
            --cache-dir "$HOME/.codexpad-codex-releases"
          export CODEX_CODE_MODE_HOST_BINARY="$CM_BUILD_DIR/artifacts/codex-code-mode-host"
          python3 scripts/download-codex-arm64.py --component code-mode-host \
            --output "$CODEX_CODE_MODE_HOST_BINARY" --cache-dir "$HOME/.codexpad-codex-releases"
          export APK_TOOLS_CACHE_DIR="$HOME/.codexpad-apk-tools"
          bash scripts/build-apk-tools-macos.sh
          export APK_HOST_BINARY="$APK_TOOLS_CACHE_DIR/bin/apk"
          openssl_prefix="$(brew --prefix openssl@3)"
          if [ -f "$openssl_prefix/etc/openssl@3/cert.pem" ]; then
            export SSL_CERT_FILE="$openssl_prefix/etc/openssl@3/cert.pem"
          fi
          export OUTPUT_ROOTFS="$CM_BUILD_DIR/artifacts/codexpad-runtime-arm64.tar.gz"
          bash scripts/package-runtime-arm64.sh
          python3 scripts/verify-imported-runtime.py "$OUTPUT_ROOTFS"
          tar -tzf "$OUTPUT_ROOTFS" | grep -F './usr/local/libexec/codexpad/codex-app-server'
          tar -xOf "$OUTPUT_ROOTFS" ./usr/local/share/codexpad/runtime.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["hasAppServer"] and d["target"]=="aarch64-unknown-linux-musl"'
          cat "$OUTPUT_ROOTFS.sha256"

      - name: Stage and compile ARM64 iPad app without signing
        script: |
          set -euo pipefail
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$(brew --prefix gnu-tar)/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CODEXPAD_ROOTFS_PATH="$CM_BUILD_DIR/artifacts/codexpad-runtime-arm64.tar.gz"
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          command -v ld.lld
          git submodule update --init --recursive upstream/ios-linuxkit
          python3 tests/codexpad/test_runtime_upgrade.py
          python3 tests/codexpad/test_ios_staging.py
          python3 tests/codexpad/test_poll_timeouts.py
          python3 tests/codexpad/test_parent_death_signal.py
          python3 tests/codexpad/test_pty_drain.py
          python3 scripts/tests/test_arm64_halfword_lanes.py
          python3 scripts/tests/test_arm64_pmull.py
          python3 scripts/prepare-arm64-ios.py --output artifacts/staged-arm64-ios
          if xcodebuild -project artifacts/staged-arm64-ios/iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/artifacts/derived-arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            build 2>&1 | tee "$CM_BUILD_DIR/artifacts/xcodebuild-arm64.log"; then
            :
          else
            pipeline_status=("${PIPESTATUS[@]}")
            status="${pipeline_status[0]}"
            [[ "$status" != 0 ]] || status="${pipeline_status[1]}"
            python3 scripts/summarize-build-failure.py artifacts/xcodebuild-arm64.log || true
            exit "$status"
          fi
          app="$CM_BUILD_DIR/artifacts/derived-arm64/Build/Products/Release-iphoneos/CodexPad.app"
          test -s "$app/root.tar.gz"
          test -x "$app/CodexPad"
          [[ "$(sha256sum "$app/root.tar.gz" | cut -d ' ' -f1)" == "$(sha256sum "$CODEXPAD_ROOTFS_PATH" | cut -d ' ' -f1)" ]]
          # Rebuild packaging from scratch so stale ZIP entries cannot survive.
          rm -rf artifacts/ipa
          rm -f artifacts/CodexPad-ARM64-unsigned.ipa
          mkdir -p artifacts/ipa/Payload
          cp -R "$app" artifacts/ipa/Payload/CodexPad.app
          (cd artifacts/ipa && zip -qry ../CodexPad-ARM64-unsigned.ipa Payload)
          python3 scripts/verify-ipa-runtime.py artifacts/CodexPad-ARM64-unsigned.ipa "$CODEXPAD_ROOTFS_PATH"

      - name: Verify the packaged engine in a real iPad simulator
        script: |
          set -euo pipefail
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CODEXPAD_ROOTFS_PATH="$CM_BUILD_DIR/artifacts/codexpad-runtime-arm64.tar.gz"
          if ! xcrun simctl list runtimes -j | python3 -c 'import json,sys; assert any(r.get("isAvailable") and ".iOS-" in r["identifier"] for r in json.load(sys.stdin)["runtimes"])'; then
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -project artifacts/staged-arm64-ios/iSH.xcodeproj \
            -scheme iSH-ARM64 -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/artifacts/derived-arm64-simulator" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= build 2>&1 | tee artifacts/xcodebuild-simulator.log
          simulator_app="$CM_BUILD_DIR/artifacts/derived-arm64-simulator/Build/Products/Release-iphonesimulator/CodexPad.app"
          # Ad-hoc signing is local to the disposable simulator product; the
          # unsigned device IPA and its single runtime archive stay unchanged.
          codesign --force --sign - "$simulator_app"
          python3 scripts/probe-ios-engine.py --app "$simulator_app" \
            --output artifacts/engine-readiness

    artifacts:
      - artifacts/engine-readiness/**
      - artifacts/xcodebuild-simulator.log
      - artifacts/xcodebuild-arm64.log
      - artifacts/derived-arm64/**/ninja-build.log
      - artifacts/codex-app-server.provenance.json
      - artifacts/codex-code-mode-host.provenance.json
      - artifacts/CodexPad-ARM64-unsigned.ipa
      - artifacts/codexpad-runtime-arm64.tar.gz
      - artifacts/codexpad-runtime-arm64.tar.gz.sha256
